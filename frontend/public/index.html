<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Центр уведомлений</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin-bottom: 12px;
      }

      .card {
        margin-top: 24px;
        padding: 24px;
        border-radius: 16px;
        background: #111827;
        border: 1px solid #334155;
      }

      code {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Центр уведомлений</h1>
      <p>Платформенный базовый стенд Track 1 запущен.</p>
      <div class="card">
        <p>Доступны только инфраструктурные заглушки:</p>
        <p><code>/health</code> и <code>/ready</code> для сервисов и шлюза.</p>
        <p>Бизнес-логика будет добавляться в треках 2-5 без изменения общей среды запуска.</p>
      </div>
    </main>
  </body>
</html>
