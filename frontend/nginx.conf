server {
  listen 80;
  server_name _;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","component":"frontend"}';
  }

  location = /ready {
    default_type application/json;
    return 200 '{"status":"ready","component":"frontend"}';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
