services:
  traefik:
    image: traefik:v3.0
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      recipients:
        condition: service_healthy
      sources:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - backend

  frontend:
    build:
      context: ./frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  recipients:
    build:
      context: ./recipients
    environment:
      SERVICE_NAME: recipients
      PORT: ${RECIPIENTS_PORT:-8081}
      DATABASE_URL: postgres://${POSTGRES_USER:-notification_center}:${POSTGRES_PASSWORD:-notification_center}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-notification_center}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${RECIPIENTS_PORT:-8081}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  sources:
    build:
      context: ./sources
    environment:
      SERVICE_NAME: sources
      PORT: ${SOURCES_PORT:-8082}
      DATABASE_URL: postgres://${POSTGRES_USER:-notification_center}:${POSTGRES_PASSWORD:-notification_center}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-notification_center}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${SOURCES_PORT:-8082}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  notifications-service:
    build:
      context: ./notifications-service
    environment:
      SERVICE_NAME: notifications-service
      PORT: ${NOTIFICATIONS_SERVICE_PORT:-8083}
      DATABASE_URL: postgres://${POSTGRES_USER:-notification_center}:${POSTGRES_PASSWORD:-notification_center}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-notification_center}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:${RABBITMQ_AMQP_PORT:-5672}/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${NOTIFICATIONS_SERVICE_PORT:-8083}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  delivery:
    build:
      context: ./delivery
    environment:
      SERVICE_NAME: delivery
      PORT: ${DELIVERY_PORT:-8084}
      DATABASE_URL: postgres://${POSTGRES_USER:-notification_center}:${POSTGRES_PASSWORD:-notification_center}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-notification_center}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:${RABBITMQ_AMQP_PORT:-5672}/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${DELIVERY_PORT:-8084}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notification_center}
      POSTGRES_USER: ${POSTGRES_USER:-notification_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notification_center}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notification_center} -d ${POSTGRES_DB:-notification_center}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit management load_definitions \"/etc/rabbitmq/definitions.json\"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  edge:
  backend:
