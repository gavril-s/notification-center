events {}

http {
  resolver 127.0.0.11 ipv6=off;

  map $http_x_request_id $request_id_value {
    default $http_x_request_id;
    "" $request_id;
  }

  map $http_x_trace_id $trace_id_value {
    default $http_x_trace_id;
    "" $request_id;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 80;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","component":"nginx"}';
    }

    location = /ready {
      default_type application/json;
      return 200 '{"status":"ready","component":"nginx"}';
    }

    location /internal/ {
      return 404;
    }

    location /api/recipients/ {
      set $recipients_upstream recipients:8081;
      limit_req zone=api_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id_value;
      proxy_set_header X-Trace-ID $trace_id_value;
      proxy_pass http://$recipients_upstream;
    }

    location /api/sources/ {
      set $sources_upstream sources:8082;
      limit_req zone=api_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id_value;
      proxy_set_header X-Trace-ID $trace_id_value;
      proxy_pass http://$sources_upstream;
    }

    location /api/notifications/ {
      set $notifications_upstream notifications-service:8083;
      limit_req zone=api_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id_value;
      proxy_set_header X-Trace-ID $trace_id_value;
      proxy_pass http://$notifications_upstream;
    }

    location / {
      set $frontend_upstream frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id_value;
      proxy_set_header X-Trace-ID $trace_id_value;
      proxy_pass http://$frontend_upstream;
    }
  }
}
