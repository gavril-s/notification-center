global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nginx
    metrics_path: /health
    static_configs:
      - targets: ["nginx:80"]

  - job_name: recipients
    metrics_path: /health
    static_configs:
      - targets: ["recipients:8081"]

  - job_name: sources
    metrics_path: /health
    static_configs:
      - targets: ["sources:8082"]

  - job_name: notifications-service
    metrics_path: /health
    static_configs:
      - targets: ["notifications-service:8083"]

  - job_name: delivery
    metrics_path: /health
    static_configs:
      - targets: ["delivery:8084"]
